<!DOCTYPE html>
<html lang="ru">
<head>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Оформление заявки — Учебный интернет-магазин">
  <meta property="og:description" content="Форма заявки учебного интернет-магазина.">
  <meta property="og:image" content="https://username.github.io/kr3-responsive-shop/images/preview.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Адаптивная форма заявки учебного интернет-магазина.">
  <title>Оформление заявки — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">VipShaurma</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1>Оформление заявки</h1>
      <p>Заполните форму — мы свяжемся с вами для подтверждения заказа.</p>

      <form class="order-form" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="order-name-page">Имя</label>
          <input class="order-form__input" id="order-name-page" name="name" type="text" required autocomplete="name">
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-email-page">E-mail</label>
          <input class="order-form__input" id="order-email-page" name="email" type="email" required autocomplete="email">
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-phone-page">Телефон</label>
          <input class="order-form__input" id="order-phone-page" name="phone" type="tel" autocomplete="tel">
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-product">Товар</label>
          <select class="order-form__select" id="order-product" name="product">
            <option value="shaurma">Шаурма с курицей</option>
            <option value="shashlik">Шашлык в лаваше</option>
            <option value="kyufta">Кюфта</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-comment">Комментарий</label>
          <textarea class="order-form__textarea" id="order-comment" name="comment" rows="4"></textarea>
        </div>

        <div class="order-form__field">
          <label>
            <input type="checkbox" name="agree" required>
            Согласен с обработкой персональных данных
          </label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
</body>
</html>
